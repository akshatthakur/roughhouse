name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build release APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk Roughhouse.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Roughhouse-apk
          path: Roughhouse.apk
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Roughhouse.apk \
            --title "Roughhouse (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download Roughhouse.apk below and open it on your phone to install." \
            --target "$GITHUB_SHA"
